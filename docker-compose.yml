services:
  db:
    image: postgres:16-alpine
    container_name: solicitudes-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solicitudes}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-solicitudes}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solicitudes-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Prueba Tecnica Backend}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-local}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://postgres:postgres@db:5432/solicitudes}
      DB_ECHO: ${DB_ECHO:-false}
      CONSUMER_BASE_URL: ${CONSUMER_BASE_URL:-http://consumer:8001}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-5}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-3}
      BACKEND_LOG_FILE_PATH: ${BACKEND_LOG_FILE_PATH:-/logs/backend.jsonl}
    volumes:
      - ./logs:/logs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: solicitudes-consumer
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://backend:8000}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-5}
      MAX_RETRY_ATTEMPTS: ${MAX_RETRY_ATTEMPTS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONSUMER_LOG_FILE_PATH: ${CONSUMER_LOG_FILE_PATH:-/logs/consumer.jsonl}
    volumes:
      - ./logs:/logs
    restart: "no"

volumes:
  postgres_data:
